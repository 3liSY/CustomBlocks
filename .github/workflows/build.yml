name: Build Mod JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle clean build --no-build-cache --rerun-tasks

      - name: Mojibake scan
        run: |
          echo "Scanning for mojibake sequences in source files..."
          if grep -rn --include="*.java" $'Ã\u00a2\|Ã‚\|â€\|Ã£\|Ã¥\|Ã«\|Ã¯' src/; then
            echo "ERROR: Mojibake sequences found in source. Fix encoding before merging."
            exit 1
          fi
          echo "Mojibake scan passed."

      - name: Sound annotation check
        run: |
          echo "Checking SoundEvents.BLOCK_NOTE_BLOCK_* usage..."
          if grep -rn --include="*.java" 'SoundEvents\.BLOCK_NOTE_BLOCK_[A-Z_]*[^.]' src/ \
              | grep -v '\.value()' | grep 'playSound\|playNote'; then
            echo "ERROR: SoundEvents.BLOCK_NOTE_BLOCK_* used without .value() in a playSound call."
            exit 1
          fi
          echo "Sound annotation check passed."

      - name: List build outputs
        run: ls -la build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: customblocks-mod
          path: build/libs/customblocks-1.0.0.jar